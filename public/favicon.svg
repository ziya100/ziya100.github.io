<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield outline with gradient -->
  <path d="M24 2 L44 10 L44 22 C44 34 34 42 24 46 C14 42 4 34 4 22 L4 10 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Shield fill -->
  <path d="M24 4 L42 11 L42 22 C42 33 33 40 24 44 C15 40 6 33 6 22 L6 11 Z" 
        fill="url(#innerGrad)" opacity="0.9"/>
  
  <!-- Inner circuit lines -->
  <line x1="24" y1="14" x2="24" y2="34" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
  <line x1="14" y1="24" x2="34" y2="24" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
  
  <!-- Corner nodes -->
  <circle cx="24" cy="14" r="2" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="24" cy="34" r="2" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="14" cy="24" r="2" fill="#7b61ff" filter="url(#glow)"/>
  <circle cx="34" cy="24" r="2" fill="#7b61ff" filter="url(#glow)"/>
  
  <!-- Center lock icon -->
  <rect x="20" y="22" width="8" height="7" rx="1" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
  <path d="M22 22 L22 19 C22 17 26 17 26 19 L26 22" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="24" cy="25.5" r="1" fill="#00f0ff"/>
  
  <!-- Hex data nodes -->
  <text x="10" y="18" font-family="monospace" font-size="5" fill="#00f0ff" opacity="0.5">0x</text>
  <text x="33" y="35" font-family="monospace" font-size="5" fill="#00ff88" opacity="0.5">FF</text>
  <text x="33" y="18" font-family="monospace" font-size="5" fill="#7b61ff" opacity="0.5">A0</text>
  <text x="10" y="35" font-family="monospace" font-size="5" fill="#ff3366" opacity="0.5">B1</text>
</svg>
